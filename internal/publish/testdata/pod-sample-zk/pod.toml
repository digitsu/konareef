pod_spec_version = "0.1"

[pod]
name = "research-bot"
version = "1.0.0"
# Round-6 B4: explicit lineage_id so saltstore.LineageIDFromManifest
# returns a deterministic 16-byte ID for this fixture. Required by
# the Type-D salt provisioning path — EnsureSaltForTypeD derives the
# lineage from the manifest, and the file-backed saltstore persists
# salt.bin under ${KONAREEF_STATE_DIR}/typed/<lineage_id_hex>/.
# Value below is the hex of 16 bytes of 0xAB.
lineage_id = "abababababababababababababababab"

[runtime]
kind = "lobster"

[directive]
template = "./prompts/system.md"

# R-V2.7: a v2 publish (--zk) requires an explicit [budget].max_sats —
# there is no default, so pods that predate v2 must add this section as a
# one-line migration (spec §6.3). 5000 matches the max_sats convention used
# by the other sample pods in this repo (demo/pods/voice-forge/pod.toml,
# examples/pods/code-reviewer/pod.toml). This fixture is ZK-CLI-only
# (main_zk_publish_test.go); no test pins a v1 pod_hash/canonical-bytes
# digest against it, so adding [budget] here does not change what any
# other test asserts.
[budget]
max_sats = 5000
